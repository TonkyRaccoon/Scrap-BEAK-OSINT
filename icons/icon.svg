<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1c2333"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#79c0ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect width="128" height="128" rx="24" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>
  
  <!-- Stylized beak / bird head -->
  <g transform="translate(64,60)" filter="url(#glow)">
    <!-- Eye (scanning) -->
    <circle cx="0" cy="-8" r="14" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="0" cy="-8" r="6" fill="#58a6ff"/>
    <circle cx="2" cy="-10" r="2" fill="#fff" opacity="0.8"/>
    
    <!-- Scanning rings -->
    <circle cx="0" cy="-8" r="22" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.4" stroke-dasharray="4 4"/>
    <circle cx="0" cy="-8" r="30" fill="none" stroke="#58a6ff" stroke-width="0.8" opacity="0.25" stroke-dasharray="3 5"/>
    
    <!-- Beak -->
    <path d="M 12 -2 L 30 8 L 12 12 Z" fill="url(#accent)" opacity="0.9"/>
    
    <!-- Digital crosshair lines -->
    <line x1="-35" y1="-8" x2="-16" y2="-8" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="16" y1="-8" x2="35" y2="-8" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="-35" x2="0" y2="-24" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="8" x2="0" y2="25" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="64" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#58a6ff" letter-spacing="3">BEAK</text>
</svg>
